plugins {
    id 'java'
    id 'xyz.wagyourtail.jvmdowngrader' version '1.2.2'
    id 'xyz.wagyourtail.unimined' version '1.3.13'
    id 'com.github.johnrengelman.shadow' version "8.1.1"
}

group 'de.florianmichael'
version '1.7.10'

base {
    archivesName = "0viaforge" // Load Earlier than others
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

idea {
    module {
        downloadJavadoc = false
        downloadSources = true
    }
}

unimined.minecraft {
    version "1.7.10"

    minecraftForge {
        loader "10.13.4.1614-1.7.10"
        mixinConfig("mixins.viaforge.json")
    }

    mappings {
        searge()
        mcp("stable", "12-1.7.10")
    }

    remap(tasks.shadowJar) {
        prodNamespace("searge")
        mixinRemap {
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "GTNH Maven"
        url = "http://jenkins.usrv.eu:8081/nexus/content/groups/public/"
        allowInsecureProtocol = true
    }
    maven {
        name = "Sponge"
        url 'https://repo.spongepowered.org/maven'
    }
    maven {
        name = "ViaVersion"
        url = "https://repo.viaversion.com"
        metadataSources {
            artifact()
        }
    }
}

jvmdg.downgradeTo = JavaVersion.VERSION_1_8

configurations {
    library
    implementation.extendsFrom library
}

def mixinProviderSpecNoClassifer = "io.github.legacymoddingmc:unimixins:0.1.16"
def mixinProviderSpec = "${mixinProviderSpecNoClassifer}:dev"

dependencies {
    implementation(mixinProviderSpec)
    //shade fileTree(dir: 'output', include: '*.jar')
    library "com.viaversion:viaversion-common:5.3.1-SNAPSHOT"
    library "com.viaversion:viabackwards-common:5.3.1-SNAPSHOT"
    library "com.viaversion:viarewind-common:4.0.7-SNAPSHOT"
    library "com.viaversion:viaaprilfools-common:4.0.2-SNAPSHOT"
    library ("com.viaversion:vialoader:4.0.3-SNAPSHOT") {
        exclude group: "com.google.guava"
        exclude group: "org.slf4j"
    }
    library ("net.raphimc:ViaLegacy:3.0.10-SNAPSHOT") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    library ("org.slf4j:slf4j-api:${project.slf4j_version}")
    library ("org.yaml:snakeyaml:${project.snake_yml_version}") {
        exclude module : "META-INF/versions/"
    }
    compileOnly("io.netty:netty-all:4.0.23.Final")
}

processResources {}

jar {
    manifest {
        attributes([
            "FMLCorePlugin": "de.florianmichael.viaforge.mixin.MixinLoader",
            "FMLCorePluginContainsFMLMod": "true",
            "ForceLoadAsMod": "true",
            "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
            "MixinConfigs": "mixins.viaforge.json",
            "Manifest-Version": 1.0
        ])
    }
    enabled = false
}

shadowJar {
    destinationDirectory = temporaryDir
    configurations = [project.configurations.library]
    duplicatesStrategy DuplicatesStrategy.EXCLUDE
    exclude("META-INF/maven/**")
    exclude("META-INF/versions/**")
}

downgradeJar {
    inputFile = shadowJar.archiveFile
    destinationDirectory = temporaryDir
}

shadeDowngradedApi {
    archiveFileName = jar.archiveFileName
}

jar.dependsOn("shadeDowngradedApi")

tasks.build {
    dependsOn(tasks.shadeDowngradedApi)
}
